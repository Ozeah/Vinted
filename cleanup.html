<!DOCTYPE html>
<html><head><title>OzeaH — Cleanup</title></head>
<body style="background:#0d0b14;color:white;font-family:monospace;padding:2rem;">
<h2>OzeaH Firestore Cleanup</h2>
<pre id="log">Starting...</pre>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
    apiKey: "AIzaSyDpjL7T0aYxiRqGsfE_oldyhg7ZTYR618I",
    authDomain: "ozeah-vinted.firebaseapp.com",
    projectId: "ozeah-vinted",
    storageBucket: "ozeah-vinted.firebasestorage.app",
    messagingSenderId: "436941369887",
    appId: "1:436941369887:web:ae1d7a62eddff3c7d2db2a",
});
var db = firebase.firestore();
var log = document.getElementById('log');

var KEEP = {};

async function run() {
    log.textContent = 'Loading users...\n';
    var snapshot = await db.collection('users').get();
    var users = snapshot.docs;
    log.textContent += 'Found ' + users.length + ' users.\n';

    for (var i = 0; i < users.length; i++) {
        var doc = users[i];
        var data = doc.data();
        var name = data.global_name || data.username || doc.id;

        if (name === 'Lxanna' || name === 'Ysheazo' || name === 'lxanna' || name === 'ysheazo') {
            KEEP[doc.id] = true;
            log.textContent += 'KEEP: ' + name + ' (' + doc.id + ')\n';
            continue;
        }

        // Delete subcollection articles first
        var articles = await db.collection('users').doc(doc.id).collection('articles').get();
        for (var j = 0; j < articles.docs.length; j++) {
            await articles.docs[j].ref.delete();
        }
        log.textContent += 'Deleted ' + articles.docs.length + ' articles for ' + name + '\n';

        // Delete user doc
        await doc.ref.delete();
        log.textContent += 'DELETED user: ' + name + ' (' + doc.id + ')\n';
    }

    log.textContent += '\nDone! Only kept users: ' + Object.keys(KEEP).length;
}

run().catch(function(e) { log.textContent += '\nERROR: ' + e.message; });
</script>
</body>
</html>
