<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OzeaH — Mon compte</title>
    <link rel="icon" type="image/png" href="vip.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <style>
        .account-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }
        .account-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--purple), var(--purple-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 800;
            color: white;
            flex-shrink: 0;
        }
        .account-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }
        .account-email {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .profile-section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.75rem;
        }
        .profile-avatar-img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
    <div class="particles" id="particles"></div>

    <div class="auth-page">
        <a href="index.html" class="auth-logo">
            <span class="logo-text">OzeaH</span>
        </a>

        <div class="auth-card" id="account-content">
        </div>

        <div class="auth-footer-links" style="margin-top:1.5rem;">
            <a href="index.html" class="auth-back">&larr; Retour a l'accueil</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="auth.js"></script>
</body>
</html>
