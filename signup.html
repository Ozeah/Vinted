<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OzeaH — Inscription</title>
    <link rel="icon" type="image/png" href="vip.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
    <div class="particles" id="particles"></div>

    <div class="auth-page">
        <a href="index.html" class="auth-logo">
            <span class="logo-text">OzeaH</span>
        </a>

        <div class="auth-card">
            <h1 class="auth-heading">Rejoins OzeaH.</h1>
            <p class="auth-desc">Cree ton compte et accede au bot qui trouve les meilleures affaires Vinted.</p>

            <button class="btn-social btn-social-discord" onclick="loginDiscord()">
                <svg width="20" height="15" viewBox="0 0 71 55" fill="white"><path d="M60.1 4.9A58.5 58.5 0 0045.4.2a.2.2 0 00-.2.1 40.8 40.8 0 00-1.8 3.7 54 54 0 00-16.2 0A37.3 37.3 0 0025.4.3a.2.2 0 00-.2-.1A58.4 58.4 0 0010.5 4.9a.2.2 0 00-.1.1C1.5 18.7-.9 32.2.3 45.5v.1a58.7 58.7 0 0017.7 9a.2.2 0 00.3-.1 42 42 0 003.6-5.9.2.2 0 00-.1-.3 38.6 38.6 0 01-5.5-2.6.2.2 0 01 0-.4l1.1-.9a.2.2 0 01.2 0 41.8 41.8 0 0035.6 0 .2.2 0 01.2 0l1.1.9a.2.2 0 010 .4 36.3 36.3 0 01-5.5 2.6.2.2 0 00-.1.3 47.2 47.2 0 003.6 5.9.2.2 0 00.3.1 58.5 58.5 0 0017.7-9v-.1c1.4-15-2.3-28.4-9.8-40.1a.2.2 0 00-.1-.1zM23.7 37.3c-3.5 0-6.3-3.2-6.3-7s2.8-7 6.3-7 6.4 3.2 6.3 7-2.8 7-6.3 7zm23.3 0c-3.5 0-6.3-3.2-6.3-7s2.8-7 6.3-7 6.4 3.2 6.3 7-2.8 7-6.3 7z"/></svg>
                S'inscrire avec Discord
            </button>

            <div class="auth-divider"><span>OU</span></div>

            <form id="signup-form" onsubmit="handleSignup(event)">
                <input type="text" id="signup-username" class="auth-field" placeholder="Nom d'utilisateur" required>
                <input type="email" id="signup-email" class="auth-field" placeholder="Adresse e-mail" required>
                <input type="password" id="signup-password" class="auth-field" placeholder="Mot de passe" required minlength="6">
                <input type="password" id="signup-confirm" class="auth-field" placeholder="Confirmer le mot de passe" required>
                <button type="submit" class="btn-auth-submit">Creer mon compte</button>
            </form>

            <p class="auth-msg" id="auth-msg"></p>

            <div class="auth-footer-links">
                <p>Deja un compte ? <a href="login.html">Se connecter</a></p>
                <a href="index.html" class="auth-back">&larr; Retour a l'accueil</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="auth.js"></script>
</body>
</html>
