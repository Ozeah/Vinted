<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OzeaH — Suivi articles</title>
    <link rel="icon" type="image/png" href="vip.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="stock.css">
</head>
<body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
    <div class="particles" id="particles"></div>

    <header>
        <nav>
            <a href="index.html" class="logo">
                <span class="logo-text">OzeaH</span>
            </a>
            <div class="nav-links">
                <a href="index.html#features">Fonctionnalités</a>
                <a href="index.html#vip">VIP</a>
                <a href="index.html#faq">FAQ</a>
            </div>
            <div class="nav-right">
                <a href="https://discord.gg/7aSMg8DEt8" class="btn btn-nav">Rejoindre</a>
                <div id="user-area">
                    <button onclick="loginDiscord()" class="btn btn-login">Connexion</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="stock-page">
        <div class="stock-topbar">
            <div class="stock-title-row">
                <h1 class="stock-title">Suivi articles</h1>
                <button class="btn-add-article" onclick="openAddModal()">+ Nouvel article</button>
            </div>
        </div>

        <div class="dash-controls">
            <div class="dash-period-tabs" id="dash-period-tabs">
                <div class="dash-period-slider" id="dash-period-slider"></div>
                <button class="dash-period-btn active" data-period="all">Tout</button>
                <button class="dash-period-btn" data-period="1m">1M</button>
                <button class="dash-period-btn" data-period="3m">3M</button>
                <button class="dash-period-btn" data-period="6m">6M</button>
                <button class="dash-period-btn" data-period="1y">1A</button>
            </div>
            <label class="urssaf-toggle" id="urssaf-toggle">
                <input type="checkbox" id="urssaf-checkbox" onchange="toggleUrssaf()">
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                <span class="urssaf-toggle-label">Micro-entrepreneur</span>
            </label>
        </div>
        <div class="dashboard-grid" id="dashboard-grid"></div>

        <div class="stock-filters">
            <div class="stock-search-wrap">
                <svg class="stock-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="stock-search" id="stock-search" placeholder="Rechercher un article...">
            </div>
            <div class="stock-status-filters" id="status-filters">
                <button class="status-filter-btn active" data-status="all">Tous</button>
                <button class="status-filter-btn" data-status="in_stock">En stock</button>
                <button class="status-filter-btn" data-status="sold">Vendus</button>
                <button class="status-filter-btn" data-status="shipped">Expédiés</button>
                <button class="status-filter-btn" data-status="finalized">Finalisés</button>
                <button class="status-filter-btn" data-status="archived">Archivés</button>
            </div>
        </div>
        <div class="stock-sort-bar" id="stock-sort-bar">
            <button class="sort-chip active" data-sort="date_purchase" data-dir="desc">Date <span class="sort-arrow">▼</span></button>
            <button class="sort-chip" data-sort="buy_price" data-dir="desc">Achat <span class="sort-arrow">▼</span></button>
            <button class="sort-chip" data-sort="sell_price" data-dir="desc">Vente <span class="sort-arrow">▼</span></button>
            <button class="sort-chip" data-sort="benefit" data-dir="desc">Benef <span class="sort-arrow">▼</span></button>
            <button class="sort-chip" data-sort="margin" data-dir="desc">Marge <span class="sort-arrow">▼</span></button>
        </div>

        <div class="stock-list" id="stock-list"></div>
    </main>

    <!-- Modal: Add / Edit article -->
    <div class="modal-overlay" id="modal-add" onclick="closeModalOverlay(event)">
        <div class="modal-content modal-large">
            <button class="modal-close" onclick="closeModal('modal-add')">&times;</button>
            <h2 class="modal-title" id="modal-add-title">Nouvel article</h2>
            <form id="form-article" onsubmit="handleArticleSubmit(event)">
                <input type="hidden" id="edit-id">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nom de l'article *</label>
                        <input type="text" id="f-name" required placeholder="Ex: Pull Col V Lacoste Bleu">
                    </div>
                    <div class="form-group">
                        <label>Référence</label>
                        <input type="text" id="f-reference" placeholder="Auto-généré si vide">
                    </div>
                    <div class="form-group form-brand-wrap">
                        <label>Marque</label>
                        <input type="text" id="f-brand" placeholder="Ex: Lacoste" autocomplete="off" oninput="onBrandInput(this.value)" onfocus="onBrandInput(this.value)">
                    </div>
                    <div class="form-group">
                        <label>Taille</label>
                        <input type="text" id="f-size" placeholder="Ex: M, 42, 38...">
                    </div>
                    <div class="form-group">
                        <label>État</label>
                        <select id="f-condition">
                            <option value="">-- Choisir --</option>
                            <option value="Neuf avec étiquette">Neuf avec étiquette</option>
                            <option value="Neuf sans étiquette">Neuf sans étiquette</option>
                            <option value="Très bon état">Très bon état</option>
                            <option value="Bon état">Bon état</option>
                            <option value="Satisfaisant">Satisfaisant</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Prix d'achat * (EUR)</label>
                        <input type="number" id="f-buy-price" required step="0.01" min="0" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Moyen de paiement</label>
                        <select id="f-payment">
                            <option value="">-- Choisir --</option>
                            <option value="Vinted">Vinted</option>
                            <option value="PayPal">PayPal</option>
                            <option value="Carte bancaire">Carte bancaire</option>
                            <option value="Espèces">Espèces</option>
                            <option value="Autre">Autre</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Prix de vente prévu (EUR)</label>
                        <input type="number" id="f-expected-price" step="0.01" min="0" placeholder="0.00">
                    </div>
                    <div class="form-group" id="f-sell-price-group" style="display:none;">
                        <label>Prix de vente réel (EUR)</label>
                        <input type="number" id="f-sell-price" step="0.01" min="0" placeholder="0.00">
                    </div>
                    <div class="form-group" id="f-sell-date-group" style="display:none;">
                        <label>Date de vente</label>
                        <input type="date" id="f-sell-date">
                    </div>
                    <div class="form-group">
                        <label>Date d'achat</label>
                        <input type="date" id="f-date">
                    </div>
                    <div class="form-group">
                        <label>URL Vinted</label>
                        <input type="url" id="f-url" placeholder="https://www.vinted.fr/...">
                    </div>
                </div>
                <div class="form-group form-full">
                    <label>Notes</label>
                    <textarea id="f-notes" rows="2" placeholder="Notes supplémentaires..."></textarea>
                </div>
                <div class="form-group form-full">
                    <label>Photo de l'article</label>
                    <div class="photo-upload" id="photo-upload">
                        <input type="file" id="f-photo" accept="image/*" onchange="handlePhotoPreview(event)" hidden>
                        <div class="photo-placeholder" id="photo-placeholder" onclick="document.getElementById('f-photo').click()">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                            <span>Cliquer pour ajouter une photo</span>
                        </div>
                        <div class="photo-preview-wrap" id="photo-preview-wrap" style="display:none">
                            <img id="photo-preview-img" class="photo-preview-img" alt="">
                            <button type="button" class="photo-remove" onclick="removePhoto()">&times;</button>
                        </div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-modal-cancel" onclick="closeModal('modal-add')">Annuler</button>
                    <button type="submit" class="btn-modal-confirm" id="btn-article-submit">Ajouter</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Register sale -->
    <div class="modal-overlay" id="modal-sell" onclick="closeModalOverlay(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('modal-sell')">&times;</button>
            <h2 class="modal-title">Enregistrer la vente</h2>
            <form id="form-sell" onsubmit="handleSellSubmit(event)">
                <input type="hidden" id="sell-id">
                <div class="sell-article-name" id="sell-article-name"></div>
                <div class="form-group">
                    <label>Prix de vente réel * (EUR)</label>
                    <input type="number" id="s-sell-price" required step="0.01" min="0" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Plateforme de vente</label>
                    <select id="s-platform">
                        <option value="Vinted">Vinted</option>
                        <option value="Leboncoin">Leboncoin</option>
                        <option value="Facebook">Facebook Marketplace</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date de vente</label>
                    <input type="date" id="s-date">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-modal-cancel" onclick="closeModal('modal-sell')">Annuler</button>
                    <button type="submit" class="btn-modal-confirm">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: History -->
    <div class="modal-overlay" id="modal-history" onclick="closeModalOverlay(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('modal-history')">&times;</button>
            <h2 class="modal-title">Historique</h2>
            <div class="history-article-name" id="history-article-name"></div>
            <div class="history-timeline" id="history-timeline"></div>
            <div class="form-actions">
                <button type="button" class="btn-modal-cancel" onclick="closeModal('modal-history')">Fermer</button>
            </div>
        </div>
    </div>

    <!-- Modal: Delete confirm -->
    <div class="modal-overlay" id="modal-delete" onclick="closeModalOverlay(event)">
        <div class="modal-content modal-small">
            <button class="modal-close" onclick="closeModal('modal-delete')">&times;</button>
            <div class="delete-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            </div>
            <h2 class="modal-title">Supprimer l'article ?</h2>
            <p class="delete-warn">Voulez-vous vraiment supprimer cet article ? Cette action est irréversible.</p>
            <input type="hidden" id="delete-id">
            <div class="form-actions">
                <button type="button" class="btn-modal-cancel" onclick="closeModal('modal-delete')">Annuler</button>
                <button type="button" class="btn-modal-delete" onclick="confirmDelete()">Supprimer</button>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 OzeaH. Tous droits réservés.</p>
        </div>
    </footer>

    <div class="brand-suggestions" id="brand-suggestions"></div>
    <script src="script.js"></script>
    <script src="stock.js"></script>
</body>
</html>
